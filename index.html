<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Retail - Luxury Bags</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">PRO-RETAIL.</div>
      <nav class="nav">
    <a href="index.html" class="active">Home</a>
    <a href="products.html">Shop</a>
    <a href="contact.html">Contact</a>
        <button class="cart-btn" onclick="toggleCart()">Cart <span id="cart-count">0</span></button>
    </nav>
    </div>
  </header>

  <main class="container">

    <!-- PRODUCTS Page Style -->
    <section class="home-hero">
      <h1>Timeless Design,<br>Built To Last</h1>
      <p>Curated luxury totes, shoulder bags and clutches</p>
      <a href="products.html" class="btn-black">Shop All Bags</a>
    </section>

  <!-- Filter pill -->
    <section class="filter-pills">
      
      <button class="pill" data-filter="crossbody">Crossbody</button>
      <button class="pill" data-filter="tote">Tote</button>
      <button class="pill" data-filter="shoulder">Shoulder</button>
      <button class="pill" data-filter="clutch">Clutch</button>
    </section>

    <!-- FEATURED PRODUCTS -->
    <section>
      <div class="products-grid" id="featured-grid"></div>
    </section>
  </main>

  <!-- CART DRAWER  -->
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-header"><h3>Your Cart</h3><button onclick="toggleCart()">×</button></div>
    <div id="cart-items"></div>
    <div class="cart-footer"><p>Total: $<span id="cart-total">0</span></p><button class="btn-black full">Checkout</button></div>
  </div>

  <script src="products.js"></script>
  <script src="main.js"></script>
</body>
</html>

    
</html>
