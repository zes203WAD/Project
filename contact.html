<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact - ROYALE CARRY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css"></head>
<body class="bg-[#F5F5DC]">
<header class="bg-white shadow sticky top-0 z-20"><nav class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
  <a href="index.html" class="text-2xl font-bold">ROYALE CARRY.</a>
  <div class="flex gap-6 items-center">
    <a href="index.html" class="text-gray-600">Home</a>
    <a href="products.html" class="text-gray-600">Shop</a>
    <a href="contact.html" class="font-bold border-b-2 border-black" aria-current="page">Contact</a>
    <button id="cart-btn" class="bg-black text-white px-4 py-2 rounded-full text-sm">Cart <span id="cart-count" class="bg-white text-black px-2 rounded-full text-xs ml-1">0</span>
    </button>
  </div>
</nav>
</header>

<main class="max-w-2xl mx-auto px-4 py-12">
  <section class="text-center">
    <h1 class="text-4xl font-extrabold">Get In Touch</h1>
    <p class="text-gray-500 mt-2">We reply within 24 hours</p>
  </section>
  
  <section class="bg-white rounded-2xl shadow p-8 border mt-8">
    <h2 class="text-xl font-bold mb-6">Contact Form</h2>
    <div id="form-success-banner" class="hidden mb-4 p-4 bg-green-50 border border-green-200 rounded-xl text-green-800 text-center" role="alert"></div>
   
    <form id="contact-form" novalidate>
      <div class="mb-4"><label for="user-name" class="block text-sm font-medium mb-2">Full Name</label>
        <input id="user-name" type="text" required placeholder="Zeeshan Afzal" class="w-full border rounded-xl p-3">
        <p id="name-error" class="hidden text-red-600 text-xs mt-2"></p></div>
      <div class="mb-4"><label for="user-email" class="block text-sm font-medium mb-2">Email Address</label>
        <input id="user-email" type="email" required placeholder="cihe@student.com" class="w-full border rounded-xl p-3"><p id="email-error" class="hidden text-red-600 text-xs mt-2"></p>
      </div>
      <div class="mb-4"><label for="user-message" class="block text-sm font-medium mb-2">Message</label>
        <textarea id="user-message" rows="5" required placeholder="Your message..." class="w-full border rounded-xl p-3"></textarea>
      </div>
      <button type="submit" class="w-full bg-black text-white py-3 rounded-full">Send Message</button>
    </form>
  
  </section>
</main>

<footer class="bg-white border-t mt-12 py-6"><div class="max-w-7xl mx-auto px-4 flex justify-between text-sm text-gray-500 footer-inner"><p>© 2025 ROYALE CARRY</p>
  <nav class="flex gap-4"><a href="index.html">Home</a><a href="products.html">Shop</a><a href="contact.html">Contact</a></nav></div></footer>
<div id="cart-overlay" class="fixed inset-0 bg-black/50 hidden z-30"></div>
<div id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-40 translate-x-full transition-transform flex flex-col">
  <div class="p-6 border-b flex justify-between"><h2 class="font-bold">Cart (<span id="drawer-count">0</span>)</h2>
  <button id="close-cart" aria-label="Close cart">&times;</button></div>
  <div id="cart-items" class="flex-1 p-6 overflow-auto"></div>
  <div class="p-6 border-t"><div class="flex justify-between font-bold"><span>Total:</span><span id="cart-total">$0</span></div>
    <button id="checkout-btn" class="w-full mt-4 bg-black text-white py-3 rounded-full">Checkout</button></div></div>
<script src="js/contact.js"></script>
</body>
</html>
