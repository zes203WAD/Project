<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Retail | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    
<header class="bg-white border-b border-gray-200 shadow-sm">

<nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

<a href="index.html" class="text-xl font-bold text-indigo-600">PRO-RETAIL.</a>

<div class="hidden md:flex items-center space-x-8">

<a href="index.html" class="font-medium text-gray-600 hover:text-indigo-600">Home</a>

<a href="products.html" class="font-medium text-gray-600 hover:text-indigo-600">Products</a>

<a href="contact.html" class="font-medium text-indigo-600" aria-current="page">Contact</a>

</div>


<button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 text-gray-600">🌓</button>

</nav>

</header>



<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">

<div class="bg-white rounded-2xl border border-gray-200 p-8 shadow-sm slide-in-animation">

<h1 class="text-3xl font-bold text-gray-900 mb-2">Contact Us</h1>

<p class="text-sm text-gray-500 mb-8">Have a question about a product or order? Fill out the form below and we will reply within 24 hours.</p>


<div id="form-success-banner" class="hidden mb-6 p-4 rounded-xl bg-emerald-50 text-emerald-700 text-sm font-medium border border-emerald-200"></div>




<form id="contact-form" class="space-y-6" novalidate>

<div>

<label for="user-name" class="block text-sm font-medium mb-2">Full Name</label>

<input type="text" id="user-name" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-sm" required>

<p id="name-error" class="hidden text-xs text-red-500 mt-1.5"></p>

</div>


<div>

<label for="user-email" class="block text-sm font-medium mb-2">Email Address</label>

<input type="email" id="user-email" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-sm" required>

<p id="email-error" class="hidden text-xs text-red-500 mt-1.5"></p>

</div>


<div>

<label for="user-message" class="block text-sm font-medium mb-2">Message</label>

<textarea id="user-message" rows="4" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-sm" required></textarea>

</div>

<button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg">Send Message</button>

</form>

</div>

</main>


<footer class="bg-gray-100 border-t border-gray-200 py-6 mt-auto">

<div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">

&copy; 2026 Pro-Retail. Student project for 203WAD.

</div>

</footer>


<script src="js/main.js"></script>

<script src="js/contact.js"></script>
</body>
</html>
