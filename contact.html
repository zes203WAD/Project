    <form id="contact-form">

        <label>Full Name</label>
        <input type="text" placeholder="Zeeshan Afzal" required>
        </div>

        <label>Email Address</label>
        <input type="email" placeholder="cihe@student.com" required>
       </div>
        <div class="form-group">
        <label>Message</label>
        <textarea rows="5" placeholder="Your message..." required></textarea>
      </div>
      <button type="submit" class="btn-black full">Send Message</button>
     </form>
     </div>
    </div>
